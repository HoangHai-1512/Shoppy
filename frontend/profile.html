<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Thông tin tài khoản - Shoppy</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f5f5f5; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh;}
        header { width: 100%; background-color: #ee4d2d; padding: 15px 50px; box-sizing: border-box; }
        header a { color: white; text-decoration: none; font-weight: bold; font-size: 24px;}
        
        .profile-card { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 400px; margin-top: 50px; text-align: center; }
        .profile-card img { width: 100px; height: 100px; border-radius: 50%; border: 3px solid #ee4d2d; margin-bottom: 20px;}
        .info-row { text-align: left; margin-bottom: 15px; font-size: 16px; border-bottom: 1px solid #eee; padding-bottom: 10px;}
        .info-row strong { color: #555; display: inline-block; width: 120px;}
        
        .btn-logout { width: 100%; padding: 12px; background-color: #333; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 20px; transition: 0.3s;}
        .btn-logout:hover { background-color: #ee4d2d; }
    </style>
</head>
<body>
    <header>
        <a href="index.html">Shoppy</a>
    </header>

    <div class="profile-card">
        <img src="" id="profileAvatar" alt="Avatar">
        <h2 id="profileName" style="margin-top: 0; color: #333;"></h2>
        
        <div class="info-row">
            <strong>Email:</strong> <span id="profileEmail"></span>
        </div>
        <div class="info-row">
            <strong>Số điện thoại:</strong> <span id="profilePhone"></span>
        </div>

        <button class="btn-logout" onclick="logout()">ĐĂNG XUẤT</button>
    </div>

    <script src="profile.js"></script>
</body>
</html>
