<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Hoàn trả đơn hàng - Shoppy</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f5f5f5; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh;}
        
        header { width: 100%; background-color: #ee4d2d; padding: 15px 50px; color: white; display: flex; box-sizing: border-box; }
        header a { color: white; text-decoration: none; font-weight: bold; font-size: 24px;}
        
        .refund-container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 400px; margin-top: 50px; text-align: center; }
        
        input, select { width: 100%; padding: 12px; margin: 15px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 14px;}
        input:focus, select:focus { border-color: #ee4d2d; outline: none; }
        
        button { width: 100%; padding: 12px; background-color: #333; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 16px; transition: 0.3s;}
        button:hover { background-color: #555; }
        
        /* Khu vực hiển thị kết quả (Hóa đơn hoàn trả) */
        #result { margin-top: 20px; text-align: left; font-size: 14px; line-height: 1.6; }
    </style>
</head>
<body>
    <header>
        <a href="index.html">Shoppy</a>
    </header>

    <div class="refund-container">
        <h2 style="color: #ee4d2d; margin-top: 0;">Yêu Cầu Hoàn Trả</h2>
        <p style="font-size: 14px; color: #666;">Nhập mã đơn hàng đã giao thành công để hệ thống xử lý hoàn tiền.</p>
        
        <form id="refundForm">
            <input type="number" id="orderId" placeholder="Nhập mã đơn hàng (VD: 1)" required min="1">
            
            <select id="refundMethod" required>
                <option value="" disabled selected>-- Chọn phương thức nhận tiền --</option>
                <option value="Chuyen_Khoan_Ngan_Hang">Chuyển khoản ngân hàng</option>
                <option value="Vi_Dien_Tu_Momo">Ví điện tử Momo/ZaloPay</option>
            </select>
            
            <button type="submit">GỬI YÊU CẦU</button>
        </form>

        <div id="result"></div>
    </div>

    <script src="refund.js"></script>
</body>
</html>
