<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Trang Chủ - Shoppy</title>
    <style>
        /* Cài đặt cơ bản */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        /* Thanh điều hướng (Header) */
        header {
            background-color: #ee4d2d; /* Màu cam Shoppy */
            padding: 15px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 { margin: 0; font-size: 28px; }

        /* Khu vực tìm kiếm */
        .search-container {
            display: flex;
            width: 40%;
        }

        .search-container input {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 4px 0 0 4px;
            outline: none;
        }

        .search-container button {
            padding: 10px 20px;
            border: none;
            background-color: #333;
            color: white;
            cursor: pointer;
            border-radius: 0 4px 4px 0;
            font-weight: bold;
        }

        .search-container button:hover { background-color: #555; }

        /* Khu vực hiển thị danh sách sản phẩm */
        .main-content {
            padding: 30px 50px;
        }

        /* Lưới sản phẩm (Grid) */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        /* Thẻ hiển thị 1 sản phẩm (Card) */
        .product-card {
            background-color: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            text-align: center;
            transition: transform 0.2s;
        }

        .product-card:hover { transform: translateY(-5px); /* Hiệu ứng nảy lên khi di chuột */ }

        .product-card img {
            width: 100%;
            height: 150px;
            background-color: #ddd; /* Khung ảnh xám tạm thời */
            object-fit: cover;
            border-radius: 4px;
        }

        .product-title {
            font-size: 16px;
            color: #333;
            margin: 15px 0 5px;
            height: 40px; /* Cố định chiều cao tên SP */
            overflow: hidden;
        }

        .product-price {
            font-size: 18px;
            color: #ee4d2d;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .btn-view {
            width: 100%;
            padding: 10px;
            background-color: white;
            color: #ee4d2d;
            border: 1px solid #ee4d2d;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-view:hover {
            background-color: #ee4d2d;
            color: white;
        }
    </style>
</head>
<body>

    <header>
        <h1>Shoppy</h1>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Tìm kiếm điện thoại, laptop...">
            <button id="searchBtn">Tìm Kiếm</button>
        </div>
        <div>
            <a href="register.html" style="color: white; text-decoration: none; font-weight: bold;">Đăng ký</a>
        </div>
    </header>

    <div class="main-content">
        <h2>Gợi ý hôm nay</h2>
        
        <div class="product-grid" id="productGrid">
            </div>
    </div>

    <script src="home.js"></script>
</body>
</html>
